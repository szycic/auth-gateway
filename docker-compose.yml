services:
  share-app:
    image: smp46/pingvin-share-x:latest
    container_name: share-app
    restart: unless-stopped
    volumes:
      - share-data:/opt/app/backend/data
      - share-images:/opt/app/frontend/public/img
    environment:
      - TRUST_PROXY=true
    networks:
      - proxy-net

  auth-gateway:
    build:
      context: ./auth-gateway
      dockerfile: Dockerfile
    container_name: auth-gateway
    restart: unless-stopped
    volumes:
      - gateway-data:/usr/src/app/data
    environment:
      - PORT=3000
      - BASE_URL=https://share.szycic.com
      - AUTH_COOKIE_NAME=share_auth_token
      - APPROVER_COOKIE_NAME=gateway_approver_session
      - APPROVER_PASSWORD=${APPROVER_PASSWORD:-szycic-share-admin}
      - APPROVER_PASSWORD_HASH=${APPROVER_PASSWORD_HASH:-}
      - SESSION_TTL_HOURS=72
      - QR_SESSION_TTL_MS=120000
      - DATA_DIR=/usr/src/app/data
      - TARGET_APP_URL=http://share-app:3000
    networks:
      - proxy-net

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy-net

volumes:
  share-data:
  share-images:
  gateway-data:
  caddy-data:
  caddy-config:

networks:
  proxy-net:
    driver: bridge
