services:
  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-gateway
    restart: unless-stopped
    volumes:
      - gateway-data:/usr/src/app/data
    environment:
      - PORT=3000
      - DATA_DIR=/usr/src/app/data
    networks:
      - proxy-net

volumes:
  gateway-data:
    name: share-app_gateway-data

networks:
  proxy-net:
    external: true
    name: proxy-net
