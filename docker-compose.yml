services:
  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-gateway
    restart: unless-stopped
    volumes:
      - gateway-data:/usr/src/app/data
      - .:/usr/src/app/config:ro
    environment:
      - PORT=3000
      - DATA_DIR=/usr/src/app/data
      - CONFIG_PATH=/usr/src/app/config/config.json
      - TARGET_APP_URL=http://share-app:3000
    networks:
      - proxy-net

volumes:
  gateway-data:
    external: true
    name: gateway-data

networks:
  proxy-net:
    external: true
    name: proxy-net
